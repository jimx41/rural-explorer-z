<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Keeper's Turn</title>
<style>
:root{--ink:#f4e9d8;--dim:#b6a68e;--amber:#f2b45c;--teal:#4fc0b0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
  background:radial-gradient(120% 90% at 50% 18%,#22243c 0%,#0d0e18 62%,#07080e 100%);
  color:var(--ink);font-family:"Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;text-align:center}
.card{max-width:560px}
h1{font-family:"Iowan Old Style",Georgia,serif;font-weight:400;font-size:clamp(34px,8vw,54px);
  margin:0 0 8px;color:#fbe3b6;text-shadow:0 0 42px rgba(242,180,92,.3)}
.sub{color:var(--amber);font-style:italic;font-family:Georgia,serif;margin:0 0 26px;letter-spacing:.04em}
p{color:#ddd0ba;line-height:1.7}
.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.links a{display:inline-block;text-decoration:none;color:var(--ink);
  border:1px solid rgba(242,180,92,.35);background:rgba(242,180,92,.09);
  padding:12px 26px;border-radius:26px;font-family:Georgia,serif;font-size:16px;
  transition:background .18s,transform .18s}
.links a:hover{background:rgba(242,180,92,.2);transform:translateY(-2px)}
footer{margin-top:42px;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<div class="card">
  <h1>The Keeper&rsquo;s Turn</h1>
  <p class="sub">a quiet valley, one evening a year</p>

     someone brings them home. A cosy exploration game with no fail states and no hurry.</p>
